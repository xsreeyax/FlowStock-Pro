services:
  postgres:
    image: postgres:17
    container_name: flowstock-postgres
    environment:
      POSTGRES_DB: flowstock_db
      POSTGRES_USER: flowstock
      POSTGRES_PASSWORD: flowstock_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: flowstock-backend
    depends_on:
      - postgres
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8080:8080"
  
  frontend:
    build:
      context: ./frontend
    container_name: flowstock-frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  postgres_data: